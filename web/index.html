<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>remotty</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/lib/xterm/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="pair" hidden>
    <form id="pair-form" class="card">
      <h1>remotty</h1>
      <p>On the host, run <code>remotty pair</code> and type the code.</p>
      <label>Code <input id="pair-code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required></label>
      <label>Device name <input id="pair-name" name="name" placeholder="tablet"></label>
      <button type="submit">Pair</button>
      <p id="pair-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <nav id="tabs" aria-label="Agents">
      <div id="find-box">
        <input id="find" type="search" placeholder="Find or create" aria-label="Find or create an agent" aria-keyshortcuts="Control+Shift+K"
               aria-controls="tab-list" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <kbd id="find-key" aria-hidden="true">Ctrl ⇧ K</kbd>
      </div>
      <ul id="tab-list"></ul>
      <ul id="tabs-hint">
        <li><kbd>Alt 1–9</kbd> open</li>
        <li><kbd>Alt ↑↓</kbd> next</li>
        <li><kbd>Alt ⇧ ↑↓</kbd> or drag to reorder</li>
      </ul>
      <div id="tab-actions">
        <button id="new-tab" type="button" aria-label="New agent">+</button>
        <button id="restore" type="button" title="Reopen the Claude Code conversations that stopped in the last 2 hours">Restore</button>
      </div>
    </nav>
    <section id="stage">
      <div id="terminal" aria-label="Terminal"></div>
      <p id="empty" hidden>No window selected.</p>
    </section>
    <div id="keys" role="toolbar" aria-label="Terminal keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-mod="ctrl" aria-pressed="false">Ctrl</button>
      <button data-key="up" aria-label="Up">↑</button>
      <button data-key="down" aria-label="Down">↓</button>
      <button data-key="enter">Enter</button>
      <button data-key="ctrl-c">^C</button>
      <button data-key="left" aria-label="Left">←</button>
      <button data-key="right" aria-label="Right">→</button>
      <button data-action="paste">Paste</button>
      <button data-action="attach" aria-label="Attach a photo or file" class="icon-attach"></button>
      <button data-action="record" aria-label="Record a voice note" aria-pressed="false" class="icon-mic"></button>
      <input id="attach-input" type="file" multiple hidden>
    </div>
    <p id="status" role="status"></p>
  </div>
</body>
</html>
